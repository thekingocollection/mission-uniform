name: Android app build

on:
  workflow_dispatch:
  push:
    branches: [android-native-app]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'mobile-web/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require production website URL
        shell: bash
        env:
          APP_URL: ${{ secrets.CAPACITOR_SERVER_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Add the CAPACITOR_SERVER_URL repository secret with your real HTTPS production website URL."
            exit 1
          fi
          case "$APP_URL" in https://*) ;; *) echo "::error::CAPACITOR_SERVER_URL must use HTTPS."; exit 1;; esac
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Generate Capacitor Android project
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL }}
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mission-uniform-op-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare release signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; skipping Play Store AAB."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mission-uniform-upload.jks"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build signed Play Store AAB
        if: steps.signing.outputs.ready == 'true'
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL }}
          KEYSTORE_PATH: ${{ runner.temp }}/mission-uniform-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap build android --androidreleasetype AAB --keystorepath "$KEYSTORE_PATH" --keystorepass "$KEYSTORE_PASSWORD" --keystorealias "$KEY_ALIAS" --keystorealiaspass "$KEY_PASSWORD"
      - name: Upload Play Store AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mission-uniform-op-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
